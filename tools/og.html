<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModelPenny share image</title>
<!-- The 1200x630 picture that link previews show. tools/render_images.mjs copies the hero's art in from
     index.html, so the two never drift apart, then saves the picture as assets/og.png. -->
<link rel="stylesheet" href="/css/site.css">
<style>
  :root { color-scheme: light; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card { height: 630px; padding: 64px 72px; display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; column-gap: 80px; overflow: hidden; }
  .card .logo img { height: 40px; }
  .card h1 { grid-column: 1; align-self: end; font-weight: 500; font-size: 66px; line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance; }
  .card .art { grid-column: 2; grid-row: 1 / 3; align-self: start; width: 300px; margin-top: -8px; }
</style>
</head>
<body>
  <div class="card">
    <span class="logo"><img src="/assets/lockup.svg" alt="ModelPenny"></span>
    <h1>AI prices change. Your code shouldn't have to.</h1>
    <figure class="art" id="art"></figure>
  </div>
</body>
</html>
