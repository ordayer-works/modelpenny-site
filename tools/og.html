<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModelPenny share image</title>
<!-- The 1200x630 picture that link previews show. tools/render_images.mjs turns it into assets/og.png. -->
<link rel="stylesheet" href="/css/site.css">
<style>
  body { width: 1200px; height: 630px; min-height: 0; display: block; overflow: hidden; }
  .card { height: 630px; padding: 64px 72px; display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; column-gap: 56px; }
  .card .receipt { grid-column: 2; grid-row: 1 / 3; align-self: center; transform: scale(0.92); transform-origin: right center; }
  .card img { height: 44px; width: auto; }
  .card h1 { grid-column: 1; align-self: end; font-weight: 500; font-size: 58px; line-height: 1.06; letter-spacing: -0.025em; max-width: 13em; text-wrap: balance; }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/lockup.svg" alt="ModelPenny">
    <h1>We work out what AI really costs you, so you don't have to.</h1>
    <figure class="receipt">
      <table>
        <caption>
          <span class="receipt__title">One day of AI calls, across three providers</span>
          <span class="receipt__note">An example, not real prices.</span>
        </caption>
        <thead>
          <tr><th scope="col">Charge</th><th scope="col">Tokens</th><th scope="col">Cost (USD)</th></tr>
        </thead>
        <tbody>
          <tr><th scope="row">Input tokens</th><td class="tokens">1,204,330</td><td>$0.1204</td></tr>
          <tr><th scope="row">Output tokens</th><td class="tokens">146,900</td><td>$0.0735</td></tr>
          <tr class="subtotal"><th scope="row">The price you see</th><td></td><td>$0.1939</td></tr>
        </tbody>
        <tbody>
          <tr class="group"><th scope="rowgroup" colspan="3">Easy to miss</th></tr>
          <tr><th scope="row">Thinking tokens</th><td class="tokens">312,400</td><td>$0.1562</td></tr>
          <tr><th scope="row">Long prompts, at 2x</th><td class="tokens">420,000</td><td>$0.0420</td></tr>
          <tr><th scope="row">Busy hours, at 2x</th><td class="tokens">210,000</td><td>$0.0210</td></tr>
        </tbody>
        <tfoot>
          <tr><th scope="row" colspan="2">What you really pay</th><td>$0.4131</td></tr>
        </tfoot>
      </table>
      <p class="receipt__proof">Prices checked at the source, 4 minutes ago.</p>
    </figure>
  </div>
</body>
</html>
